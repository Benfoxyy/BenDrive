services:
  db:
    container_name: db
    image: postgres:alpine
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    restart: always
    ports:
      - '5432:5432'
    expose:
      - 5432

  minio:
    image: minio/minio
    container_name: minio
    expose:
      - 9000
      - 9001
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - './minio/data:/data'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: backend
    command: >
      sh -c "
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./core:/app
    ports:
      - '8000:8000'
    restart: always
    depends_on:
      - db
      - redis
      - minio

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  worker:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: celery -A core worker --loglevel=info
    restart: always
    volumes:
      - ./core:/app
    depends_on:
      - db
      - redis
      - backend